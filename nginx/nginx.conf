# Enterprise-Grade Nginx Load Balancer Configuration for PulseQuiz
# Tuned to support 100 - 100,000 (1 Lakh) Concurrent Real-Time WebSockets

user nginx;
worker_processes auto;
worker_rlimit_nofile 131072; # Required to handle >100,000 concurrent sockets
pid /var/run/nginx.pid;

events {
    worker_connections 65536; # High file descriptor capacity per worker
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-throughput logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=16k flush=2s;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    types_hash_max_size 2048;

    # Gzip compression for static web assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Socket.IO Connection Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream Node.js Worker Cluster with Session Affinity (Sticky Sessions)
    # Sticky sessions are MANDATORY for Socket.IO HTTP long-polling handshake
    upstream quiz_backend_cluster {
        # ip_hash ensures each mobile phone stays bound to the same worker process
        ip_hash;

        server backend-1:3001 max_fails=3 fail_timeout=10s;
        server backend-2:3001 max_fails=3 fail_timeout=10s;
        server backend-3:3001 max_fails=3 fail_timeout=10s;
        server backend-4:3001 max_fails=3 fail_timeout=10s;

        # Keepalive connections to upstream workers
        keepalive 512;
    }

    # Frontend Client Upstream
    upstream quiz_frontend_cluster {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # Client Max Upload Size for PDF/Excel files (15MB)
        client_max_body_size 15M;

        # Health & Metrics Endpoint for Load Balancers & Cloud Monitoring
        location /api/health {
            proxy_pass http://quiz_backend_cluster/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/metrics {
            proxy_pass http://quiz_backend_cluster/api/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # REST API Routes
        location /api/ {
            proxy_pass http://quiz_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering configuration
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Real-time WebSocket & Socket.IO Engine Route
        location /socket.io/ {
            proxy_pass http://quiz_backend_cluster;
            proxy_http_version 1.1;

            # Essential WebSocket Upgrade Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Client Identity Preservation for Rate Limiters & Analytics
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for long-lived real-time quiz connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # Disable proxy buffering for zero-latency bidirectional events
            proxy_buffering off;
        }

        # Static Frontend Application
        location / {
            proxy_pass http://quiz_frontend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
